[pytest]
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests requiring database connection (slower)
    unit: pure-function tests with no I/O (fast)
    sandbox: integration tests that hit a real Salesforce sandbox (skip if SF_* env vars not set)
addopts =
    -ra
    --strict-markers
