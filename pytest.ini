[pytest]
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests requiring database connection (slower)
    unit: pure-function tests with no I/O (fast)
    sandbox: integration tests that hit a real Salesforce sandbox (skip if SF_* env vars not set)
    live: live-LLM generation eval probes (real gateway; skip if ANTHROPIC_API_KEY not set; periodic, never PR-gating)
addopts =
    -ra
    --strict-markers
    -m "not sandbox and not live"
